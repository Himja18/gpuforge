# Provision an Ubuntu GPU worker: Docker + NVIDIA Container Toolkit, then pre-pull the image.
#   ansible-playbook -i inventory.ini infra/ansible/gpu_node.yml
- name: Provision GPU worker nodes
  hosts: gpu_nodes
  become: true
  vars:
    gpuforge_image: ghcr.io/your-org/gpuforge:latest
  tasks:
    - name: Verify the NVIDIA driver is loaded
      ansible.builtin.command: nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
      register: gpu_info
      changed_when: false

    - name: Show GPUs
      ansible.builtin.debug:
        var: gpu_info.stdout_lines

    - name: Install Docker
      ansible.builtin.apt:
        name: [docker.io, curl, gnupg]
        state: present
        update_cache: true

    - name: Add NVIDIA Container Toolkit signing key
      ansible.builtin.shell: |
        curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
          | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
      args:
        creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

    - name: Add NVIDIA Container Toolkit repository
      ansible.builtin.shell: |
        curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
          | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' \
          > /etc/apt/sources.list.d/nvidia-container-toolkit.list
      args:
        creates: /etc/apt/sources.list.d/nvidia-container-toolkit.list

    - name: Install NVIDIA Container Toolkit
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: true

    - name: Configure Docker to use the NVIDIA runtime
      ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
      notify: Restart docker

    - name: Pre-pull the GPUForge image
      community.docker.docker_image:
        name: "{{ gpuforge_image }}"
        source: pull

    - name: Smoke test GPU access from a container
      ansible.builtin.command: >
        docker run --rm --gpus all {{ gpuforge_image }}
        python -c "import torch; assert torch.cuda.is_available(); print(torch.cuda.get_device_name(0))"
      changed_when: false

  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
