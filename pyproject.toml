[build-system]
requires = ["setuptools>=68", "wheel", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "gpuforge"
version = "0.1.0"
description = "GPU-accelerated MLOps platform: custom CUDA kernels, numerical validation, AMP/DDP training, TensorRT inference and performance analytics"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.18", "tensorrt>=10.0", "onnxconverter-common>=1.14"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["gpuforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks"]  # notebook cells favour readability over lint rules

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E731"]  # small lambdas for test/benchmark tables are intentional
